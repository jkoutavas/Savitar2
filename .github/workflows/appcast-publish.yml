name: Publish Sparkle appcast

# Republish appcast for an existing GitHub Release (e.g. after a failed push to master).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.18)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-appcast:
    name: Publish Sparkle appcast PR
    if: github.repository == 'jkoutavas/Savitar2'
    runs-on: macos-26
    timeout-minutes: 20
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish appcast via pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: bash .github/scripts/publish-sparkle-appcast.sh "${{ inputs.tag }}"

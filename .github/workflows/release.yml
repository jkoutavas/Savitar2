name: Release

# Produces the official, Developer ID-signed and notarized Savitar build.
#
# Only the repository owner can trigger this:
#   * It runs solely on tag pushes (v*) and manual dispatch — both require write
#     access to this repo, which forks/PRs do not have.
#   * Signing secrets live in the protected `release` environment, so the job
#     waits for a required reviewer (you) before it can read them.
#   * `if: github.repository == ...` stops forked copies of this workflow from
#     attempting a release even if they add their own secrets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Signed & notarized release
    if: github.repository == 'jkoutavas/Savitar2'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history so the build number (git commit count) is accurate.
          fetch-depth: 0

      - name: Show tool versions
        run: xcodebuild -version

      - name: Install Ruby tooling (fastlane)
        working-directory: client
        run: bundle install

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Prepend our keychain to the search list so codesign finds the identity,
          # keeping the runner's existing keychains available.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/asc_authkey.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple
        working-directory: client
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # The tag drives the marketing version (e.g. refs/tags/v2.0.16 -> 2.0.16).
          # Empty on manual dispatch, where the lane falls back to the tag at HEAD.
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
          # APP_STORE_CONNECT_KEY_PATH is exported by the previous step.
        run: bundle exec fastlane release

      - name: Upload release artifact to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: Savitar-release
          path: client/fastlane/release/Savitar.zip
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          # Pull the section for this version: everything between "## [x.y.z]" and
          # the next "## [" heading, then strip leading blank lines.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | awk 'NF { seen = 1 } seen' > "$notes_file"
          if [ -s "$notes_file" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release notes for $version sourced from CHANGELOG.md:"
            cat "$notes_file"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No '## [$version]' section in CHANGELOG.md; will auto-generate notes."
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Attach signed build to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            notes_args=(--notes-file "${{ steps.notes.outputs.file }}")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            client/fastlane/release/Savitar.zip \
            --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}" \
          || gh release upload "$GITHUB_REF_NAME" \
               client/fastlane/release/Savitar.zip --clobber

      - name: Generate and publish Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_EDDSA_PRIVATE_KEY not set; skipping appcast update."
            exit 0
          fi
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tag="$GITHUB_REF_NAME"
          updates_dir="client/appcast/updates"
          key_file="$RUNNER_TEMP/sparkle-ed25519.key"
          mkdir -p "$updates_dir"
          cp client/fastlane/release/Savitar.zip "$updates_dir/Savitar.zip"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | awk 'NF { seen = 1 } seen' > "$updates_dir/Savitar.md"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$key_file"
          cd client
          xcodebuild -resolvePackageDependencies \
            -project Savitar2.xcodeproj -scheme Savitar2 \
            -derivedDataPath build/sparkle-tools -quiet
          generate_appcast="build/sparkle-tools/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
          "$generate_appcast" \
            --ed-key-file "$key_file" \
            --download-url-prefix "https://github.com/jkoutavas/Savitar2/releases/download/${tag}/" \
            appcast/updates
          rm -f "$key_file"
          mv appcast/updates/appcast.xml appcast/appcast.xml
          cp appcast/updates/*.md appcast/ 2>/dev/null || true
          ruby <<'RUBY'
          appcast = "appcast/appcast.xml"
          url = "https://github.com/jkoutavas/Savitar2/blob/master/CHANGELOG.md"
          text = File.read(appcast)
          link = "            <sparkle:fullReleaseNotesLink>#{url}</sparkle:fullReleaseNotesLink>"
          text = if text.include?("fullReleaseNotesLink")
            text.gsub(/<sparkle:fullReleaseNotesLink>[^<]*<\/sparkle:fullReleaseNotesLink>/, link.strip)
          else
            text.gsub(
              /(<sparkle:releaseNotesLink>[^<]*<\/sparkle:releaseNotesLink>)/,
              "\\1\n#{link}"
            )
          end
          File.write(appcast, text)
          RUBY
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/appcast/appcast.xml client/appcast/*.md
          if git diff --staged --quiet; then
            echo "Appcast unchanged."
            exit 0
          fi
          git commit -m "Update Sparkle appcast for ${tag}"
          git push origin HEAD:master

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

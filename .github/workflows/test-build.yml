name: Test Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SwiftLint (pinned)
        run: |
          # Keep this version in sync with the SwiftLint build phase in Savitar2.xcodeproj.
          VERSION=0.65.0
          curl -sSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${VERSION}/portable_swiftlint.zip"
          unzip -oq swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint
        working-directory: client
        run: |
          swiftlint version
          swiftlint --strict

  macos-test-build:
    name: macOS unsigned test build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          xcodebuild -version
          pod --version

      - name: Generate CocoaPods support files
        working-directory: client
        run: pod install

      - name: Resolve Swift packages
        working-directory: client
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Savitar2.xcworkspace \
            -scheme Savitar2 \
            -derivedDataPath build

      - name: Build for testing
        working-directory: client
        run: |
          xcodebuild build-for-testing \
            -workspace Savitar2.xcworkspace \
            -scheme Savitar2 \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES

      - name: Run tests
        working-directory: client
        run: |
          xcodebuild test-without-building \
            -workspace Savitar2.xcworkspace \
            -scheme Savitar2 \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES

      - name: Package unsigned app
        working-directory: client/build/Build/Products/Debug
        run: zip -r Savitar-debug.zip Savitar.app

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Savitar-debug-unsigned
          path: client/build/Build/Products/Debug/Savitar-debug.zip
